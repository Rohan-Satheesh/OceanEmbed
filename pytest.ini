[pytest]
# Bare `pytest` (unlike `python -m pytest`) doesn't add the project root to sys.path,
# so `from data.xxx import ...` fails with ModuleNotFoundError. `pythonpath` fixes that
# directly rather than relying on every invocation using `python -m`.
pythonpath = .
testpaths = tests
filterwarnings =
    # Benign numpy/C-API version skew inside the compiled esmpy extension, not our code;
    # confirmed harmless — the regrid test that triggers it asserts correct output shape/values.
    ignore:numpy.ndarray size changed, may indicate binary incompatibility:RuntimeWarning
